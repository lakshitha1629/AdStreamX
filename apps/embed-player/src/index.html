<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>AdStreamX Player</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #e5e7eb; font: 14px system-ui, sans-serif; }
    #player { position: absolute; inset: 0; }
    #player > .asx-player { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; }
    .embed-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script type="module" src="./embed.js"></script>
</body>
</html>
